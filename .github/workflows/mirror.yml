name: Mirror and Deploy

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 6 * * 0'
  issues:
    types: [opened, reopened]

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  taxonomy_url_src: https://ftp.ncbi.nih.gov/pub/taxonomy/taxdump.tar.gz
  taxonomy_local_site: ${{ github.workspace }}/assets/taxdump.tar.gz
  dbases_url_src: https://pubmlst.org/data/dbases.xml
  dbases_local_site: ${{ github.workspace }}/assets/dbases.xml

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -lhRt ${{ github.workspace }}

      - name: Download taxonomy from NCBI FTP
        run: |
          mkdir -pv $(dirname ${{ env.taxonomy_local_site }})
          curl -fsSL ${{ env.taxonomy_url_src }} > ${{ env.taxonomy_local_site }}

      - name: Download dbases XML from PubMLST
        run: |
          mkdir -pv $(dirname ${{ env.dbases_local_site }})
          curl -fsSL ${{ env.dbases_url_src }} > ${{ env.dbases_local_site }}

      - name: Record download times
        run: |
          mkdir -pv _data
          DOWNLOAD_TIME="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "last_download: \"${DOWNLOAD_TIME}\"" > _data/taxdump_download.yml
          echo "local_path: \"${{ env.taxonomy_local_site }}\"" >> _data/taxdump_download.yml
          echo "remote_url: \"${{ env.taxonomy_url_src }}\"" >> _data/taxdump_download.yml
          cat _data/taxdump_download.yml
          echo "last_download: \"${DOWNLOAD_TIME}\"" > _data/dbases_download.yml
          echo "local_path: \"${{ env.dbases_local_site }}\"" >> _data/dbases_download.yml
          echo "remote_url: \"${{ env.dbases_url_src }}\"" >> _data/dbases_download.yml
          cat _data/dbases_download.yml

      - name: Upload taxdump artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxdump.tar.gz
          path: ${{ env.taxonomy_local_site }}

      - name: Upload dbases artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbases.xml
          path: ${{ env.dbases_local_site }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
