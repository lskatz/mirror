name: Download and then Upload PubMLST dbases.xml

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 6 * * 0'
  issues:
    types: [opened, reopened]

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  dbases_url_src: http://pubmlst.org/data/dbases.xml
  dbases_local_site: ${{ github.workspace }}/assets/dbases.xml

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: check files
        run: |
          ls -lhRt ${{ github.workspace }}
      - name: Download dbases XML from PubMLST
        run: |
          mkdir -pv $(dirname ${{ env.dbases_local_site }})
          curl ${{ env.dbases_url_src }} > ${{ env.dbases_local_site }}
      - name: Record dbases download time
        run: |
          mkdir -pv _data
          echo "last_download: \"$(date -u +"%Y-%m-%d %H:%M:%S UTC")\"" > _data/dbases_download.yml
          echo "local_path: \"${{ env.dbases_local_site }}\"" >> _data/dbases_download.yml
          echo "remote_url: \"${{ env.dbases_url_src }}\"" >> _data/dbases_download.yml
          cat _data/dbases_download.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
            name: dbases.xml
            path: ${{ env.dbases_local_site }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
